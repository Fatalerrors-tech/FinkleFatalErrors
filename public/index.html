
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatroom</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #151515;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.chat-container {
    width: 90%;
    max-width: 650px;
    height: 650px;
    background: #222;
    border: 1px solid #444;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px #0008;
}

header {
    padding: 20px;
    background: #292929;
    border-bottom: 1px solid #444;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 5px 0 0;
    color: #aaa;
    font-size: 13px;
}

#messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    background: #333;
    padding: 12px;
    border-radius: 10px;
    max-width: 80%;
    align-self: flex-start;
    overflow-wrap: anywhere;
}

.message.mine {
    background: #4356b5;
    align-self: flex-end;
}

.username {
    font-size: 12px;
    color: #bbb;
    margin-bottom: 5px;
}

.message.mine .username {
    color: #ddd;
}

.timestamp {
    font-size: 10px;
    color: #aaa;
    margin-top: 6px;
    text-align: right;
}

.input-area {
    display: flex;
    padding: 15px;
    gap: 10px;
    background: #292929;
    border-top: 1px solid #444;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #181818;
    color: white;
    outline: none;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #5268df;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #687df0;
}

.username-area {
    padding: 10px 15px;
    background: #202020;
    display: flex;
    gap: 10px;
    align-items: center;
}

.username-area input {
    max-width: 180px;
}

@media(max-width: 500px) {
    .chat-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <header>
        <h1>💬 The Chatroom</h1>
        <p>A place to talk with everyone.</p>
    </header>

    <div class="username-area">
        <label for="username">Username:</label>
        <input id="username" value="Guest" maxlength="20">
    </div>

    <div id="messages">
        <div class="message">
            <div class="username">System</div>
            Welcome to the chatroom! Say hello!
        </div>
    </div>

    <div class="input-area">
        <input
            id="messageInput"
            placeholder="Type a message..."
            maxlength="500"
            autocomplete="off"
        >
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const username = document.getElementById("username");

function sendMessage() {
    const text = input.value.trim();
    const name = username.value.trim() || "Guest";

    if (!text) return;

    const message = document.createElement("div");
    message.className = "message mine";

    const user = document.createElement("div");
    user.className = "username";
    user.textContent = name;

    const content = document.createElement("div");
    content.textContent = text;

    const time = document.createElement("div");
    time.className = "timestamp";
    time.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    message.append(user, content, time);
    messages.appendChild(message);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
    input.focus();
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
